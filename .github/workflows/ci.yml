name: CI

on:
  push: { branches: [main] }
  pull_request:

# One run per branch. Five commits pushed in five minutes used to leave five
# full runs competing for runners, each paying for a browser job whose answer
# the next commit had already superseded — and on a private repository those
# are billed minutes. The tip is what anybody reads a tick for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  community-standalone:
    # The open-core boundary, enforced by the repository itself.
    #
    # This used to check out the *pair* and `rm -rf factory-pro` to simulate the
    # commercial workspace being absent. It cannot any more, and does not need
    # to: Community and Pro are separate repositories, so factory-pro/ is not in
    # this checkout and never will be. Every run here is a standalone run by
    # construction, which is a stronger guarantee than a deletion step.
    #
    # If this job ever needs the commercial workspace to pass, the boundary has
    # been broken — widen @factory/plugin-sdk instead of relaxing this.
    #
    # `scripts/verify-standalone.sh` is the version to run on a working tree
    # that does have factory-pro/ beside it.
    #
    # Both supported platforms run, because a platform claim is a guarantee and
    # this project does not keep guarantees nobody has watched fail. Windows is
    # absent on purpose: steps run through `bash -c` and work is stopped by
    # signalling a process group, so the honest answer there is WSL2 (see
    # docs/install.md) rather than a job that would go green by not exercising
    # either mechanism.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # 24 is the floor `engines` states, because the store imports
        # `node:sqlite` — absent before 22.5 and only settled in 24.
        with: { node-version: '24' }
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # The browser layer, which for eighteen increments ran nowhere but a laptop.
  #
  # It is the suite that has caught three defects nothing below it could: a
  # disclaimer panel that sat over the board on load, an accept button that
  # dismissed the panel without doing the thing it had refused, and a Queue all
  # that queued nothing and said nothing. Every one of those passed the 5,457
  # steps underneath. So a green CI without this job was a CI that could be
  # wrong about the half of the product people look at.
  #
  # Serial by configuration (`workers: 1`), because the scenarios each start
  # their own daemon, and Chromium only, which is what the config asks for.
  # Nothing here needs an agent CLI installed: the fixtures spawn the daemon
  # with an **empty PATH** on purpose, so provider availability is identical on
  # a laptop with three agents and on a bare runner.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      # The scenarios spawn the built daemon; Vite serves the page from source.
      - run: pnpm build
      - run: pnpm --filter @factory/web exec playwright install --with-deps chromium
      - run: pnpm --filter @factory/web test:e2e
      # The report and the traces are the only way somebody who cannot
      # reproduce a browser failure can see what the page looked like when it
      # happened. `trace: 'retain-on-failure'` is already set in the config.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # What a newcomer actually does, run as a job so it cannot quietly rot: clone,
  # install, build, start the daemon, ask it for a page. The first public
  # version of this project shipped a `pnpm build` that did not build the board,
  # and the README promised one served from the same process — a five-minute
  # failure that every test in the suite passed straight over, because no test
  # ran the documented commands in order.
  first-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: the build produces the board as well as the engine
        run: test -f apps/web/dist/index.html
      - name: a user scope can be created
        run: node apps/cli/dist/bin.js init --scope user
        env:
          FACTORY_HOME: ${{ runner.temp }}/.xaedalon/.factory
      - name: the daemon serves the board it just built
        env:
          FACTORY_HOME: ${{ runner.temp }}/.xaedalon/.factory
          FACTORY_PORT: '7317'
        run: |
          node apps/daemon/dist/bin.js &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:7317/api/health >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:7317/api/health | grep -q '"ok":true'
          curl -sf http://127.0.0.1:7317/ | grep -q 'id="app"'
