# OpenAI Codex CLI.
#
# NOT VERIFIED. The `codex` binary was not installed on the machine this was
# written on, so the flags below are a plausible shape rather than a checked
# one. They are marked provisional, which makes `factory doctor` say so out
# loud instead of letting someone find out when a run fails on an unrecognised
# flag.
#
# To verify: install the CLI, run `codex --help`, correct the fields below, and
# drop the `provisional` flag. Nothing else has to change — a provider is data.
kind: factory.provider/v1
id: codex
displayName: OpenAI Codex
summary: OpenAI's coding agent.
command: codex
install: npm install -g @openai/codex
docs: https://developers.openai.com/codex/cli/

supports:
  - non_interactive
  - tool_use
  - file_access

models:
  strong: gpt-5-codex
  balanced: gpt-5-codex
  fast: gpt-5-codex-mini

promptFlag: '--prompt'
modelFlag: '--model'

session:
  mode: none

# Empty for both profiles, and that is a refusal to claim rather than a decision.
# The Codex CLI is not installed on the machine this was written on, so nothing
# about its confinement has been measured — see `provisional` below. Its docs
# describe a `--sandbox workspace-write` mode that looks like exactly the right
# Default, which is precisely why it is not written here: a flag that reads
# correctly and does nothing is the mistake this increment has already made once
# today.
permissionArgs:
  default: []
  full-access: []
extraArgs: []
stdin: /dev/null
env: {}

# Unverified, like everything else in this descriptor: the CLI is not installed
# on the machine this was written on. If Codex authenticates some other way,
# this line is harmless — it permits a variable rather than requiring one.
passEnv: ['OPENAI_API_KEY']

provisional: true
provisionalNote: >-
  Install the Codex CLI and run `codex --help`, then correct
  packages/plugins/provider-codex/provider.yaml and remove this flag.
