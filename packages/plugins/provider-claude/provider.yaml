# Claude Code.
#
# Flags verified against `claude --help` on 2026-09-08.
kind: factory.provider/v1
id: claude
displayName: Claude Code
summary: Anthropic's coding agent.
command: claude
install: npm install -g @anthropic-ai/claude-code
docs: https://docs.claude.com/en/docs/claude-code

supports:
  - non_interactive
  - session_resume
  - streaming
  - tool_use
  - file_access
  - mcp

# Roles, not ids. `--model` takes an alias for "the latest model of this tier"
# or a full name, and the alias is the better choice here: it keeps tracking the
# current model with no edit at all.
models:
  strong: opus
  balanced: sonnet
  fast: haiku

promptFlag: '-p'
modelFlag: '--model'
effortFlag: '--effort'
# What `--effort` accepts. Declared so the builder can offer them rather than
# leaving a free text box over a closed set.
effortValues: [low, medium, high]
# The prototype claimed Claude could only select a sub-agent by writing "@name"
# into the prompt. It has a real flag; the prototype's note was out of date.
subagentFlag: '--agent'

session:
  # By id, not by "the most recent conversation here".
  #
  # `-c` was the original choice and it worked for chaining a task's phases,
  # but it is imprecise and, for a person, useless. Imprecise: with worktrees
  # off, every task in a project runs in one directory, so "most recent" is
  # whichever task ran last. Useless by hand: an *interactive* `claude -c` in
  # that directory reports "No conversation found to continue", and so does the
  # `--resume` picker — both exclude the sessions `claude -p` creates, which is
  # every session Factory makes. Only `--resume <id>` opens one.
  #
  # So Factory chooses the id. `--session-id` starts the session and `--resume`
  # continues it; they are not interchangeable — each refuses the other's case
  # ("already in use" / "no conversation found with session ID"). Verified
  # against the real CLI on 2026-09-14.
  mode: id
  idFlag: '--session-id'
  resumeFlag: '--resume'

# Verified against Claude Code 2.1.273 on 2026-09-15 by running it, because the
# first two configurations read correctly in `--help` and did nothing useful:
#
#   --tools default            did NOT name the code-running tools back in;
#                              the session had no Bash at all.
#   --permission-mode dontAsk  means "do not ask, and deny" — Write was refused
#                              session-wide.
#
# What the flags below were measured to do, in a neutral directory:
#   write a file in the workspace      OK
#   run a shell command                OK
#   write a file outside the workspace REFUSED ("--restricted confines the file
#                                      tools to the working directory")
#   shell redirection outside it       REFUSED
# and the run never hung, which is what `--permission-prompts none` buys:
# anything that would prompt is denied instead of waiting for a person who
# is not there.
#
# The tools have to be named because `--restricted` removes the code-running
# ones and WebFetch unless `--tools` does. All twelve were accepted.
permissionArgs:
  default:
    - '--restricted'
    - '--tools'
    - 'Bash,Edit,Write,Read,Glob,Grep,MultiEdit,NotebookEdit,TodoWrite,WebFetch,WebSearch,Task'
    # Edits are applied without asking; `--restricted` refuses bypassPermissions
    # anyway, so this is the most permissive mode available under it.
    - '--permission-mode'
    - 'acceptEdits'
    - '--permission-prompts'
    - 'none'
  full-access: ['--permission-mode', 'bypassPermissions']

# Measured to extend the confinement: a file in the added directory was written
# and a third directory was still refused. Factory uses it for the artifacts
# root, which lives under the project rather than the worktree.
directoryFlag: '--add-dir'

extraArgs: []

# Non-interactive Claude waits on stdin without this.
stdin: /dev/null

env:
  # Without this a phase that spawns a background sub-agent is killed at 600s.
  CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: '0'

# Survives the Default profile's credential filter, which would otherwise
# withhold it for looking exactly like what it is.
#
# One name, because this is the only auth variable `claude --help` documents. A
# subscription login keeps its credential in the keychain instead, so a machine
# with nothing here is the ordinary case rather than a misconfiguration — which
# is why doctor warns and does not refuse.
passEnv: ['ANTHROPIC_API_KEY']
